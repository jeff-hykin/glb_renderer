<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GLB Renderer</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box }
    html, body { height: 100%; overflow: hidden; font-family: system-ui, sans-serif }
    #app { position: fixed; inset: 0; background: #ffffff }
    #drop-hint {
        position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
        color: #888; font-size: 1.1rem; pointer-events: none; text-align: center; padding: 2rem;
        transition: opacity .2s; z-index: 5;
    }
    #drop-hint.hidden { opacity: 0 }
    #drop-hint.active { color: #6cf; background: rgba(100,200,255,.08) }
    #bar {
        position: fixed; top: 0; left: 0; right: 0; z-index: 10;
        display: flex; gap: .6rem; align-items: center; padding: .6rem .8rem;
        background: rgba(20,20,26,.85); backdrop-filter: blur(8px); color: #ddd; font-size: .85rem;
    }
    #bar label {
        cursor: pointer; padding: .35rem .7rem; border-radius: 6px;
        background: #2e2e3a; color: #ddd; user-select: none;
    }
    #bar label:hover { background: #3a3a48 }
    #bar input[type=file] { display: none }
    #name { opacity: .7; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
    .spacer { flex: 1 }
    .toggle { display: flex; gap: .3rem; align-items: center; cursor: pointer; user-select: none }
</style>
</head>
<body>
<div id="app"></div>
<div id="bar">
    <label>Open GLB/GLTF<input id="file" type="file" accept=".glb,.gltf"></label>
    <label class="toggle"><input id="autorotate" type="checkbox"> auto-rotate</label>
    <label class="toggle"><input id="wireframe" type="checkbox"> wireframe</label>
    <span id="name"></span>
    <span class="spacer"></span>
    <span style="opacity:.5">drag &amp; drop a file anywhere</span>
</div>
<div id="drop-hint">Loading…</div>

<script type="module">
    import * as THREE from "https://esm.sh/three@0.169.0"
    import { OrbitControls } from "https://esm.sh/three@0.169.0/examples/jsm/controls/OrbitControls.js"
    import { GLTFLoader } from "https://esm.sh/three@0.169.0/examples/jsm/loaders/GLTFLoader.js"
    import { RoomEnvironment } from "https://esm.sh/three@0.169.0/examples/jsm/environments/RoomEnvironment.js"

    const app = document.getElementById("app")
    const hint = document.getElementById("drop-hint")
    const nameEl = document.getElementById("name")

    const renderer = new THREE.WebGLRenderer({ antialias: true })
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2))
    renderer.toneMapping = THREE.ACESFilmicToneMapping
    renderer.toneMappingExposure = 1.05
    renderer.shadowMap.enabled = true
    renderer.shadowMap.type = THREE.PCFSoftShadowMap
    app.appendChild(renderer.domElement)

    const scene = new THREE.Scene()
    // white background / skybox
    scene.background = new THREE.Color(0xffffff)

    const camera = new THREE.PerspectiveCamera(50, 1, 0.01, 10000)
    camera.position.set(3, 2, 5)

    const controls = new OrbitControls(camera, renderer.domElement)
    controls.enableDamping = true

    // image-based lighting for soft, even reflections
    const pmrem = new THREE.PMREMGenerator(renderer)
    scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture

    // three-point-ish studio lighting on a bright sky
    const key = new THREE.DirectionalLight(0xffffff, 2.6)
    key.position.set(6, 12, 8)
    key.castShadow = true
    key.shadow.mapSize.set(2048, 2048)
    key.shadow.bias = -0.0005
    scene.add(key)
    scene.add(key.target)

    const fill = new THREE.DirectionalLight(0xffffff, 0.9)
    fill.position.set(-8, 4, -2)
    scene.add(fill)

    const rim = new THREE.DirectionalLight(0xffffff, 1.1)
    rim.position.set(-4, 6, -10)
    scene.add(rim)

    scene.add(new THREE.HemisphereLight(0xffffff, 0xcfd4dc, 0.7))
    scene.add(new THREE.AmbientLight(0xffffff, 0.25))

    // soft contact shadow on an invisible ground plane
    const ground = new THREE.Mesh(
        new THREE.PlaneGeometry(1, 1),
        new THREE.ShadowMaterial({ opacity: 0.22 }),
    )
    ground.rotation.x = -Math.PI / 2
    ground.receiveShadow = true
    scene.add(ground)

    const loader = new GLTFLoader()
    let current = null

    function clear() {
        if (!current) { return }
        scene.remove(current)
        current.traverse((o) => {
            if (o.geometry) { o.geometry.dispose() }
            if (o.material) {
                const mats = Array.isArray(o.material) ? o.material : [o.material]
                for (const m of mats) { m.dispose() }
            }
        })
        current = null
    }

    function frameObject(obj) {
        const box = new THREE.Box3().setFromObject(obj)
        const size = box.getSize(new THREE.Vector3())
        const center = box.getCenter(new THREE.Vector3())
        const radius = Math.max(size.x, size.y, size.z) * 0.5 || 1
        controls.target.copy(center)
        const dist = radius / Math.sin((camera.fov * Math.PI / 180) / 2) * 1.3
        const dir = new THREE.Vector3(1, 0.6, 1).normalize()
        camera.position.copy(center).addScaledVector(dir, dist)
        camera.near = dist / 100
        camera.far = dist * 100
        camera.updateProjectionMatrix()

        // park the shadow ground at the model's base, sized generously
        ground.position.set(center.x, box.min.y, center.z)
        ground.scale.set(radius * 8, radius * 8, 1)

        // fit the key light's shadow frustum to the model
        const s = key.shadow
        s.camera.near = dist / 100
        s.camera.far = dist * 4
        s.camera.left = -radius * 1.5
        s.camera.right = radius * 1.5
        s.camera.top = radius * 1.5
        s.camera.bottom = -radius * 1.5
        key.position.set(center.x + radius * 1.5, center.y + radius * 3, center.z + radius * 2)
        key.target.position.copy(center)
        key.target.updateMatrixWorld()
        s.camera.updateProjectionMatrix()

        controls.update()
    }

    function enableShadows(obj) {
        obj.traverse((o) => {
            if (o.isMesh) {
                o.castShadow = true
                o.receiveShadow = true
            }
        })
    }

    function applyWireframe(on) {
        if (!current) { return }
        current.traverse((o) => {
            if (o.material) {
                const mats = Array.isArray(o.material) ? o.material : [o.material]
                for (const m of mats) { m.wireframe = on }
            }
        })
    }

    function loadFromUrl(url, label) {
        hint.classList.remove("hidden")
        hint.textContent = "Loading…"
        loader.load(url, (gltf) => {
            clear()
            current = gltf.scene
            scene.add(current)
            enableShadows(current)
            frameObject(current)
            applyWireframe(document.getElementById("wireframe").checked)
            nameEl.textContent = label || ""
            hint.classList.add("hidden")
        }, undefined, (err) => {
            hint.classList.remove("hidden")
            hint.textContent = "Failed to load: " + (err?.message || err)
            console.error(err)
        })
    }

    function loadFromFile(file) {
        const url = URL.createObjectURL(file)
        loader.load(url, (gltf) => {
            URL.revokeObjectURL(url)
            clear()
            current = gltf.scene
            scene.add(current)
            enableShadows(current)
            frameObject(current)
            applyWireframe(document.getElementById("wireframe").checked)
            nameEl.textContent = file.name
            hint.classList.add("hidden")
        }, undefined, (err) => {
            URL.revokeObjectURL(url)
            hint.classList.remove("hidden")
            hint.textContent = "Failed to load: " + (err?.message || err)
            console.error(err)
        })
    }

    // file picker
    document.getElementById("file").addEventListener("change", (e) => {
        const f = e.target.files[0]
        if (f) { loadFromFile(f) }
    })

    // drag & drop
    addEventListener("dragover", (e) => { e.preventDefault(); hint.classList.remove("hidden"); hint.classList.add("active"); hint.textContent = "Drop to load" })
    addEventListener("dragleave", (e) => { if (e.target === document.documentElement) { hint.classList.remove("active"); if (current) { hint.classList.add("hidden") } } })
    addEventListener("drop", (e) => {
        e.preventDefault()
        hint.classList.remove("active")
        const f = e.dataTransfer.files[0]
        if (f) { loadFromFile(f) }
    })

    // toggles
    document.getElementById("autorotate").addEventListener("change", (e) => { controls.autoRotate = e.target.checked })
    document.getElementById("wireframe").addEventListener("change", (e) => applyWireframe(e.target.checked))

    function resize() {
        const w = innerWidth, h = innerHeight
        renderer.setSize(w, h)
        camera.aspect = w / h
        camera.updateProjectionMatrix()
    }
    addEventListener("resize", resize)
    resize()

    controls.autoRotateSpeed = 1.5
    function animate() {
        requestAnimationFrame(animate)
        controls.update()
        renderer.render(scene, camera)
    }
    animate()

    // auto-load a sample if present next to this page
    loadFromUrl("./model.glb", "model.glb")
</script>
</body>
</html>
